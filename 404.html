<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite nicht gefunden – 1aWG.de</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@0,400;0,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    .fehler-box { max-width: 480px; padding: 2rem; }
    .fehler-zahl { font-size: 6rem; font-weight: 700; color: var(--color-accent); line-height: 1; font-family: var(--font-headline); }
    .fehler-box h1 { font-size: 1.8rem; margin: 1rem 0 0.5rem; }
    .fehler-box p { color: var(--color-muted); margin-bottom: 2rem; }
  </style>
</head>
<body>
<div class="fehler-box">
  <div class="fehler-zahl">404</div>
  <h1>Seite nicht gefunden</h1>
  <p>Diese Seite existiert leider nicht. Vielleicht wurde sie verschoben oder der Link ist veraltet.</p>
  <a href="index.html" class="btn-accent btn me-2">
    <i class="bi bi-house me-1"></i>Zur Startseite
  </a>
  <a href="kontakt.html" class="btn-outline-primary-custom btn">
    <i class="bi bi-envelope me-1"></i>Kontakt
  </a>
</div>
<!-- Automatische Weiterleitung nach 8 Sekunden -->
<script>
  setTimeout(function () { window.location.href = 'index.html'; }, 8000);
</script>
</body>
</html>
